# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. Java 17 설정
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # 3. application.yml 생성
    - name: Create application.yml
      run: |
        mkdir -p src/main/resources
        echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml
    
    # 4. Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    # 5. Gradle 빌드
    - name: Build with Gradle
      run: ./gradlew clean bootJar
    
    # 6. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    
    # 7. Docker 이미지 빌드 & 푸시 (ARM64 네이티브)
    - name: Build and Push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest
    
    # 8. 배포
    - name: Deploy
      run: |
        docker stop moongeul-backend || true
        docker rm moongeul-backend || true
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest
        docker run -d \
          --name moongeul-backend \
          -p 8080:8080 \
          --restart unless-stopped \
          ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest
        docker image prune -af
