# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  # 백엔드 빌드와 배포는 깃허브 액션을 사용
  build-and-push:
    name: Build & Push (GitHub-hosted)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create application.yml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      - name: Create application-jwt.yml
        run: |
          echo "${{ secrets.APPLICATION_JWT_YML }}" > src/main/resources/application-jwt.yml

      - name: Create application-oauth.yml
        run: |
          echo "${{ secrets.APPLICATION_OAUTH_YML }}" > src/main/resources/application-oauth.yml

      - name: Create application-book.yml
        run: |
          echo "${{ secrets.APPLICATION_BOOK_YML }}" > src/main/resources/application-book.yml
          
      - name: Create Firebase serviceAccountKey.json (base64)
        run: |
          echo "${{ secrets.FIREBASE_JSON_KEY }}" | base64 -d > src/main/resources/serviceAccountKey.json

      - name: Check Firebase JSON file size
        run: |
          ls -l src/main/resources/serviceAccountKey.json
          wc -c < src/main/resources/serviceAccountKey.json

      - name: Validate Firebase JSON (no leak)
        run: |
          python - <<'PY'
          import json
          p="src/main/resources/serviceAccountKey.json"
          with open(p,"rb") as f:
            b=f.read()
          print("bytes:", len(b))
          # BOM 제거 시도(있으면 제거)
          s=b.decode("utf-8-sig")
          try:
            json.loads(s)
            print("JSON parse: OK")
          except Exception as e:
            print("JSON parse: FAIL", e)
            # 어디가 깨졌는지 힌트만(앞 80바이트만)
            print("head:", repr(s[:80]))
            raise
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest

  deploy:
    # 배포서버에서는 단순히 이미지 풀받고 실행
    name: Deploy (Self-hosted)
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Deploy
        run: |
          docker stop moongeul-backend || true
          docker rm moongeul-backend || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest
          docker run -d \
            --name moongeul-backend \
            -p 9000:8080 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/moongeul-backend:latest
          docker image prune -af
